// Edits ZTheme so that its RSS loading spinner is used when KSRSS or Sol is installed is installed
HUDReplacer:NEEDS[HUDReplacer,KSRSS,ZTheme]
{
	filePath = GameData/ZTheme/PluginData/mods/planetpacks/rss/
	priority = 15
}
HUDReplacer:NEEDS[HUDReplacer,Sol-Configs,Sol-Textures,ZTheme]
{
	filePath = GameData/ZTheme/PluginData/mods/planetpacks/rss/
	priority = 15
}
